name: Render ClipForge Video

on:
  workflow_dispatch:
    inputs:
      job_id:
        required: true
      callback_token:
        required: true
      server_url:
        required: true

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    
    services:
      bgutil-provider:
        image: brainicism/bgutil-ytdlp-pot-provider:latest
        ports:
          - 4416:4416

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js (JS runtime for yt-dlp challenge solver)
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install FFmpeg
        run: |
          # Replace slow Azure mirrors with main Ubuntu mirrors to prevent hanging
          sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|http://archive.ubuntu.com/ubuntu|g' /etc/apt/sources.list
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python deps
        run: pip3 install --upgrade -r requirements.txt

      - name: Run worker
        env:
          PYTHONPATH: ${{ github.workspace }}
          # ── AI / LLM Keys ──────────────────────────────────────────────────
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OMNIROUTE_CLOUD_KEY: ${{ secrets.OMNIROUTE_CLOUD_KEY }}
          # ── Storage ────────────────────────────────────────────────────────
          S3_ACCESS_KEY: ${{ secrets.S3_ACCESS_KEY }}
          S3_SECRET_KEY: ${{ secrets.S3_SECRET_KEY }}
          S3_BUCKET_NAME: ${{ secrets.S3_BUCKET_NAME }}
          S3_ENDPOINT_URL: ${{ secrets.S3_ENDPOINT_URL }}
          S3_PUBLIC_URL_PREFIX: ${{ secrets.S3_PUBLIC_URL_PREFIX }}
          # ── YouTube ────────────────────────────────────────────────────────
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          # ── Misc ───────────────────────────────────────────────────────────
          CLIPFORGE_CALLBACK_SERVER_URL: ${{ inputs.server_url }}
        run: |
          python3 app/gha_worker.py \
            --job-id "${{ inputs.job_id }}" \
            --callback-token "${{ inputs.callback_token }}" \
            --server-url "${{ inputs.server_url }}"
