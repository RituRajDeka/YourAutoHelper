name: Render ClipForge Video

on:
  workflow_dispatch:
    inputs:
      job_id:
        required: true
      callback_token:
        required: true
      server_url:
        required: true

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Verify FFmpeg
        run: ffmpeg -version
      - name: Install Python deps
        run: pip3 install -r requirements.txt
      - name: Run worker
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python3 app/gha_worker.py \
            --job-id "${{ inputs.job_id }}" \
            --callback-token "${{ inputs.callback_token }}" \
            --server-url "${{ inputs.server_url }}"
