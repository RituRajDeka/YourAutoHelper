name: Render ClipForge Video

on:
  workflow_dispatch:
    inputs:
      job_id:
        required: true
      callback_token:
        required: true
      server_url:
        required: true

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js (JS runtime for yt-dlp challenge solver)
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install FFmpeg
        run: |
          # Replace slow Azure mirrors with main Ubuntu mirrors to prevent hanging
          sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|http://archive.ubuntu.com/ubuntu|g' /etc/apt/sources.list
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python deps
        run: pip3 install --upgrade -r requirements.txt

      - name: Run client compatibility test
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          # Fetch the config first so the cookies file is generated for testing
          python3 -c "
          import requests, os
          from pathlib import Path
          resp = requests.get('${{ inputs.server_url }}/api/jobs/${{ inputs.job_id }}/config', headers={'Authorization': 'Bearer ${{ inputs.callback_token }}'})
          resp.raise_for_status()
          config = resp.json()
          cookies = config.get('youtube_cookies', '')
          if cookies:
              Path('downloads').mkdir(exist_ok=True)
              cookies_str = cookies.strip()
              if not cookies_str.startswith('# Netscape HTTP Cookie File') and not cookies_str.startswith('# HTTP Cookie File'):
                  cookies_str = '# Netscape HTTP Cookie File\n' + cookies_str
              with open('downloads/cookies.txt', 'w') as f:
                  f.write(cookies_str)
          "
          python3 app/test_downloader.py
        
      - name: Run worker
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python3 app/gha_worker.py \
            --job-id "${{ inputs.job_id }}" \
            --callback-token "${{ inputs.callback_token }}" \
            --server-url "${{ inputs.server_url }}"
