name: Render ClipForge Video

on:
  workflow_dispatch:
    inputs:
      job_id:
        required: true
      callback_token:
        required: true
      server_url:
        required: true

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE20: false

      - name: Set up Python
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 python3-pip ffmpeg

      - name: Install dependencies
        run: pip3 install -r requirements.txt

      - name: Run worker
        env:
          JOB_ID: ${{ inputs.job_id }}
          CALLBACK_TOKEN: ${{ inputs.callback_token }}
          SERVER_URL: ${{ inputs.server_url }}
        run: python3 -m app.gha_worker
